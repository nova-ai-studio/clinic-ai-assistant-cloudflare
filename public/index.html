<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lumière Dental Assistant</title>
<meta name="description" content="Demo AI assistant for a fictional dental clinic, answering in English or French from a knowledge base stored in Cloudflare Vectorize." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236f9275' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M7 3c-2.5 0-4 2-4 4.5 0 3 1.5 4.5 2 7 .5 2.5 1 6.5 2.5 6.5s1.5-3 2-5 1-3 2.5-3 2 1 2.5 3 .5 5 2 5 2-4 2.5-6.5 2-4 2-7C21 5 19.5 3 17 3c-2 0-3 1-5 1S9 3 7 3z'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
  :root {
    --page: #ffffff;
    --panel: #f7f9f6;
    --panel-head: #f1f5ef;
    --text: #1d2a22;
    --text-2: #46564c;
    --muted: #7c8a80;
    --accent: #6f9275;          /* dusty green */
    --accent-strong: #557a5c;
    --accent-soft: #edf3eb;
    --hl: #e2ede0;              /* rows in context */
    --line: #e2e8e1;
    --fill-1: rgba(29, 52, 36, 0.04);
    --fill-2: rgba(29, 52, 36, 0.08);
    --danger: #b4483c;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font: 14px/21px var(--sans);
    font-feature-settings: "cv11";
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  svg.i20 { width: 20px; height: 20px; }
  svg.i12 { width: 12px; height: 12px; }

  .frame { display: flex; height: 100dvh; }

  /* ── Chat ─────────────────────────────────────────────────────────── */
  .chat { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .scroller { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #d5ddd4 transparent; }
  .column { max-width: 808px; margin: 0 auto; padding: 24px 20px 0; display: flex; flex-direction: column; min-height: 100%; }
  .transcript { padding-top: 4px; }

  /* ── Start screen: logo, a tall centered input, suggestions under it ── */
  .column.empty { justify-content: center; padding-bottom: 9vh; }
  .column.empty .spark, .column.empty .extra-space, .column.empty .jump { display: none; }
  .column.empty .dock { position: static; padding: 0; background: none; }
  .column.empty .composer { padding: 14px 14px 12px 18px; border-radius: 20px; align-items: flex-end; }
  .column.empty .composer textarea { min-height: 78px; font-size: 16px; line-height: 24px; padding: 4px 2px; }
  .column.empty .send { width: 36px; height: 36px; border-radius: 10px; }
  .column:not(.empty) .chips { display: none; }
  .composer { view-transition-name: composer; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 720px; margin: 22px auto 0; }
  .chips button {
    height: 38px; padding: 0 16px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--page);
    color: var(--text-2); font-size: 14px;
    transition: border-color .15s, background .15s, color .15s, transform .15s;
  }
  .chips button svg { width: 13px; height: 13px; margin-right: -4px; opacity: 0; transform: translate(-3px, 3px); transition: opacity .15s, transform .15s; }
  .chips button:hover { border-color: #b9cfb6; background: var(--accent-soft); color: var(--text); transform: translateY(-1px); }
  .chips button:hover svg { opacity: 1; transform: none; color: var(--accent-strong); }

  .turn-user { margin-top: 40px; display: flex; justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 12px 16px; border-radius: 12px;
    background: var(--accent-soft);
    font: 15px/23px var(--sans); color: var(--text);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }

  .turn-bot { margin-top: 28px; display: flex; flex-direction: column; gap: 16px; }
  .status {
    align-self: flex-start; max-width: 100%;
    margin: 12px 0 -6px -6px; padding: 6px; border-radius: 8px;
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; line-height: 20px; color: var(--muted); text-align: left;
  }
  .status .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--accent); flex: none; }
  .status.loading .dot { animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 50% { opacity: .3; } }
  /* tool steps: the tool name; its details expand on click */
  .steps { margin: 0 0 -4px -8px; display: flex; flex-direction: column; gap: 2px; max-width: calc(100% + 8px); }
  .step { border-radius: 10px; transition: background .2s; }
  .step.open { background: var(--fill-1); }
  .step-head {
    display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px 0 8px; border-radius: 10px;
    font-size: 13px; color: var(--muted); transition: background .15s;
  }
  .step-head:hover { background: var(--fill-1); }
  .step.open .step-head:hover { background: none; }
  .step-head svg.i14 { color: var(--accent); }
  .step-head .tool { font: 500 12.5px/18px var(--mono); color: var(--text-2); }
  .step-head svg.chev { width: 12px; height: 12px; color: #a3b0a6; transition: transform .2s; }
  .step.open .step-head svg.chev { transform: rotate(90deg); }
  .step-head .spin { display: none; width: 14px; height: 14px; border-radius: 99px; border: 2px solid #dbe7d8; border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .step.running .step-head .spin { display: inline-block; }
  .step.running .step-head svg { display: none; }
  .step.running .step-head { cursor: default; }
  .step.running .step-head .tool {
    background: linear-gradient(90deg, var(--text-2) 0 35%, var(--accent) 50%, var(--text-2) 65% 100%);
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.3s linear infinite;
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .step.enter { animation: step-in .25s ease-out; }
  @keyframes step-in { from { opacity: 0; transform: translateY(-4px); } }
  .step.err .step-head .tool, .step.err .step-head svg.i14 { color: var(--danger); }
  .step-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
  .step.open .step-body { grid-template-rows: 1fr; }
  .step-body > div { overflow: hidden; }
  .sd { padding: 2px 14px 12px 30px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; line-height: 20px; color: var(--text-2); }
  .sd-arg { margin-bottom: 4px; color: var(--text); font-weight: 500; }
  .sd-row { display: flex; align-items: baseline; gap: 14px; }
  .sd-row .k { flex: 1; min-width: 0; }
  .sd-row .v { flex: none; font: 12px/20px var(--mono); color: var(--accent-strong); }
  .sd-none { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .step.running .step-head .tool, .caret { animation: none; } .step-body { transition: none; } }

  /* booking form the assistant shows in the chat */
  .bform {
    max-width: 560px; padding: 14px; border-radius: 14px; background: var(--page);
    border: 1px solid var(--line); box-shadow: 0 2px 12px rgba(29, 52, 36, .05);
    display: flex; flex-direction: column; gap: 12px; transition: opacity .2s;
  }
  .bform-head { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text); }
  .bform-head svg { color: var(--accent); }
  .bform-head .dur { font-weight: 400; color: var(--muted); }
  .bslots { display: flex; flex-wrap: wrap; gap: 6px; }
  .bslot { position: relative; }
  .bslot input { position: absolute; opacity: 0; pointer-events: none; }
  .bslot span {
    display: flex; flex-direction: column; padding: 6px 11px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); font-size: 13px; line-height: 18px; color: var(--text);
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .bslot span:hover { border-color: #b9cfb6; }
  .bslot small { font-size: 11.5px; line-height: 15px; color: var(--muted); }
  .bslot input:checked + span { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .bslot input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
  .bfields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bfields .wide { grid-column: 1 / -1; }
  .bfields input:not([type="checkbox"]), .bfields textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); outline: none;
    font: 14px/20px var(--sans); color: var(--text); background: var(--page); transition: border-color .15s;
  }
  .bfields input:focus, .bfields textarea:focus { border-color: var(--accent); }
  .bfields textarea { resize: vertical; min-height: 38px; max-height: 120px; }
  .bcheck { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-2); cursor: pointer; }
  .bcheck input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .bfoot { display: flex; align-items: center; gap: 10px; }
  .bfoot .err { flex: 1; color: var(--danger); font-size: 13px; }
  .bbtn { margin-left: auto; height: 34px; padding: 0 16px; border-radius: 9px; display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; transition: background .15s; }
  .bbtn:hover { background: var(--accent-strong); }
  .bform.sent { opacity: .6; }
  .bform.sent * { cursor: default !important; }
  .bform.booked { opacity: 1; }
  .bform.booked .bbtn { background: var(--accent-strong); }

  /* booking confirmation under the answer */
  .bconfirm {
    align-self: flex-start; max-width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px 10px 10px; border-radius: 12px; text-align: left;
    background: var(--accent-soft); border: 1px solid #cfe0cb; transition: border-color .15s;
  }
  .bconfirm:hover { border-color: var(--accent); }
  .bconfirm .tick { width: 30px; height: 30px; border-radius: 99px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; }
  .bconfirm .txt { display: flex; flex-direction: column; min-width: 0; }
  .bconfirm .what { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text); }
  .bconfirm .what b { font: 600 13px/20px var(--mono); color: var(--accent-strong); margin-right: 6px; }
  .bconfirm .when { font-size: 13px; line-height: 18px; color: var(--text-2); }

  .prose { font: 15px/26px var(--sans); color: var(--text); overflow-wrap: anywhere; }
  .prose p, .prose ul, .prose ol { margin: 0; }
  .prose > :not(:first-child) { margin-top: 14px; }
  .prose p { padding: 0 56px 0 4px; }
  .prose ul, .prose ol { padding: 0 56px 0 28px; }
  .prose li { padding-left: 6px; }
  .prose li + li { margin-top: 6px; }
  .prose p + ul, .prose p + ol { margin-top: 6px; }
  .prose li::marker { color: var(--accent); font-weight: 600; }
  .prose strong { font-weight: 600; color: #15221a; }
  .prose em { font-style: italic; }
  .caret { display: inline-block; width: 7px; height: 16px; margin-left: 3px; vertical-align: -3px; border-radius: 1px; background: var(--accent); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .prose.error { color: var(--danger); font-family: var(--sans); font-size: 14px; }

  .typing { display: inline-flex; gap: 5px; padding: 8px 4px; }
  .typing span { width: 6px; height: 6px; border-radius: 99px; background: var(--muted); animation: pulse 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }

  .spark { height: 46px; }
  .extra-space { flex-grow: 1; min-height: 24px; }

  /* ── Composer ─────────────────────────────────────────────────────── */
  .dock { position: sticky; bottom: 0; z-index: 5; padding: 24px 0 20px; background: linear-gradient(rgba(255,255,255,0), var(--page) 24px); }
  .jump {
    position: absolute; left: 50%; top: -32px; transform: translateX(-50%);
    width: 36px; height: 36px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.9); border: 1px solid var(--line);
    box-shadow: 0 2px 8px rgba(29, 52, 36, .08);
    display: none; align-items: center; justify-content: center; color: var(--text-2);
  }
  .jump.show { display: flex; }
  .composer {
    position: relative; z-index: 1;
    padding: 8px; border-radius: 14px;
    background: var(--page);
    box-shadow: 0 0 0 1px var(--line), 0 4px 18px rgba(29, 52, 36, 0.06);
    display: flex; align-items: flex-end; gap: 8px;
    transition: box-shadow .15s;
  }
  .composer:focus-within { box-shadow: 0 0 0 1px var(--accent), 0 4px 18px rgba(29, 52, 36, 0.08); }
  .composer textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent;
    font: 15px/21px var(--sans); color: var(--text);
    padding: 5.5px 6px; min-height: 32px; max-height: 240px;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .send {
    width: 32px; height: 32px; border-radius: 8px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--fill-2); color: var(--muted);
    transition: background .15s, color .15s;
  }
  .send.ready { background: var(--accent); color: #fff; }
  .send:disabled { cursor: default; }
  .chin {
    display: none; justify-content: flex-end;
    margin: -8px -8px 0; padding: 8px 8px 0; height: 48px;
    background: var(--page);
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; line-height: 17px; color: var(--muted);
  }
  .pill {
    height: 24px; padding: 0 8px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2);
  }
  .pill:hover { background: var(--fill-1); }
  .pill .count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
  .pill .count:empty { display: none; }
  #open-panel, #open-book { display: none; }

  /* ── Dataset panel ────────────────────────────────────────────────── */
  .resize {
    position: relative; width: 12px; flex: none; cursor: col-resize; touch-action: none; outline: none;
  }
  .resize::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 44px;
    transform: translate(-50%, -50%); border-radius: 99px;
    background: var(--line); transition: background .15s, height .15s;
  }
  .resize:hover::after, .resize:focus-visible::after, body.resizing .resize::after { background: var(--accent); height: 64px; }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing .panel, body.resizing .chat { pointer-events: none; }

  /* collapse / expand */
  body:not(.resizing) .panel { transition: width .32s cubic-bezier(.2, .8, .2, 1), opacity .22s, margin .32s, border-width .32s; }
  .panel.will-collapse { opacity: .45; }
  .frame.panel-collapsed .panel { width: 0 !important; margin-right: 0; border-width: 0; opacity: 0; pointer-events: none; }
  .frame.panel-collapsed .resize { display: none; }
  /* Knowledge-base button in the top-right corner, shown while the panel is collapsed. */
  /* A sage tab attached to the right edge of the window, holding the illustration. */
  .panel-tab {
    position: fixed; z-index: 20; top: 12px; right: 0;
    width: 84px; height: 72px; padding: 0 6px 0 0; border: 0;
    border-radius: 20px 0 0 20px;
    background: linear-gradient(90deg, #e9f1e6 0%, #dbe8d7 100%);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: translateX(100%); pointer-events: none;
    transition: opacity .2s, transform .3s cubic-bezier(.2, .8, .2, 1), width .2s, background .2s;
  }
  .frame.panel-collapsed .panel-tab { opacity: 1; transform: none; pointer-events: auto; transition-delay: .12s; }
  .panel-tab:hover { width: 92px; background: linear-gradient(90deg, #e2ede0 0%, #d0e1cc 100%); }
  .panel-tab:hover .kb-illus, .panel-tab:hover .bk-illus { transform: scale(1.05); }
  .panel-tab.book { top: 92px; }
  .frame.panel-collapsed .panel-tab.book { transition-delay: .18s; }

  /* the bookings illustration: a tilted calendar page with a picked, checked slot and a small clock */
  .bk-illus { width: 56px; height: 58px; overflow: visible; transition: transform .2s; stroke-linecap: round; stroke-linejoin: round; }
  .bk-back { fill: #dbe8d7; stroke: #a9c0ac; stroke-width: 1.2; }
  .bk-body { fill: #f4f8f2; stroke: #557a5c; stroke-width: 1.4; }
  .bk-head { fill: #a8c2a6; stroke: #557a5c; stroke-width: 1.4; }
  .bk-ring { fill: none; stroke: #557a5c; stroke-width: 1.8; }
  .bk-days circle { fill: #b9cdb7; }
  .bk-pick { fill: #fff; stroke: #557a5c; stroke-width: 1.3; }
  .bk-check { fill: none; stroke: #557a5c; stroke-width: 1.7; stroke-dasharray: 9; animation: bk-draw 3.6s ease-in-out infinite; }
  .bk-clock circle { fill: #edf3eb; stroke: #6f9275; stroke-width: 1.3; }
  .bk-clock path { fill: none; stroke: #557a5c; stroke-width: 1.4; }
  .bk-clock .m { transform-box: view-box; transform-origin: 10.5px 37.5px; animation: bk-tick 8s steps(12) infinite; }
  @keyframes bk-draw { 0%, 15% { stroke-dashoffset: 9; } 35%, 100% { stroke-dashoffset: 0; } }
  @keyframes bk-tick { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .bk-check, .bk-clock .m { animation: none; } }
  .panel-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }

  /* the illustration: a tilted bucket holding stacked cards, keywords rising out of it */
  .kb-illus { width: 58px; height: 60px; overflow: visible; transition: transform .2s; stroke-linecap: round; stroke-linejoin: round; }
  .kb-handle { fill: none; stroke: #a9c0ac; stroke-width: 1.5; }
  .kb-opening { fill: #a8c2a6; stroke: #557a5c; stroke-width: 1.4; }
  .kb-cards rect { fill: #fff; stroke: #557a5c; stroke-width: 1.3; }
  .kb-cards path { fill: none; stroke: #9cb79f; stroke-width: 1.2; }
  .kb-body { fill: #f4f8f2; stroke: #557a5c; stroke-width: 1.4; }
  .kb-band { fill: none; stroke: #8fae94; stroke-width: 1.2; }
  .kb-rim { fill: none; stroke: #557a5c; stroke-width: 1.6; }
  .kb-words rect { fill: #edf3eb; stroke: #6f9275; stroke-width: 1.2; }
  .kb-words circle { fill: #8fae94; }
  .kb-words > * { transform-box: fill-box; animation: kw-float 3.2s ease-in-out infinite; }
  .kb-words .w2 { animation-delay: .5s; }
  .kb-words .w3 { animation-delay: 1s; }
  .kb-words .w4 { animation-delay: .25s; }
  .kb-words .w5 { animation-delay: .75s; }
  .panel-tab:hover .kb-words > * { animation-duration: 1.4s; }
  @keyframes kw-float { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-2px); opacity: .75; } }
  @media (prefers-reduced-motion: reduce) { .kb-words > * { animation: none; } }
  .panel-tab .count {
    position: absolute; bottom: 6px; right: 10px;
    min-width: 15px; height: 15px; padding: 0 4px; border-radius: 99px; border: 2px solid #dbe8d7;
    box-sizing: content-box; background: var(--accent); color: #fff; font: 600 10px/15px var(--sans); text-align: center;
  }
  .panel-tab .count:empty { display: none; }
  .panel-tab.ping .count { animation: ping 1s ease-out 2; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(111, 146, 117, .5); } 100% { box-shadow: 0 0 0 10px rgba(111, 146, 117, 0); } }
  #collapse-panel { width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
  #collapse-panel:hover { background: var(--fill-2); color: var(--text); }

  .panel {
    width: 560px; flex: none; margin: 8px 8px 8px 0;
    border-radius: 10px; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  .panel-head {
    flex: none; padding: 10px 10px 10px 16px; background: var(--panel-head);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  .panel-head .titles { flex: 1; min-width: 0; }
  .views { display: flex; gap: 4px; min-width: 0; }
  .views button {
    height: 30px; padding: 0 10px; border-radius: 8px; min-width: 0;
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 1;
    font: 600 14px/20px var(--sans); color: var(--muted); white-space: nowrap;
    transition: color .15s, background .15s, box-shadow .15s;
  }
  .views button > span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .views button:hover { color: var(--text-2); background: var(--fill-1); }
  .views button[aria-selected="true"] { color: var(--text); background: var(--page); box-shadow: 0 1px 2px rgba(29, 52, 36, .10), 0 0 0 1px var(--line); }
  .views .count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; text-align: center; flex: none; }
  .views .count:empty { display: none; }
  .panel[data-view="book"] .embed-btn { display: none !important; }
  .seg { position: relative; display: inline-flex; padding: 2px; border-radius: 8px; background: var(--fill-2); }
  .seg button { position: relative; z-index: 1; height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); transition: color .25s; }
  .seg button[aria-pressed="true"] { color: var(--accent-strong); }
  .seg .thumb {
    position: absolute; top: 2px; bottom: 2px; left: 2px; right: 50%;
    border-radius: 6px; background: var(--page);
    box-shadow: 0 1px 2px rgba(29, 52, 36, .14), 0 0 0 1px rgba(111, 146, 117, .12);
  }
  .panel-body { overflow-x: hidden; }
  .embed-btn {
    height: 30px; padding: 0 12px; border-radius: 8px;
    display: none; align-items: center; gap: 7px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
    box-shadow: 0 1px 2px rgba(29, 52, 36, .15);
    transition: background .15s, transform .1s;
  }
  .embed-btn.show { display: inline-flex; animation: pop .18s ease-out; }
  .embed-btn:hover { background: var(--accent-strong); }
  .embed-btn:active { transform: scale(.97); }
  .embed-btn .n { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: rgba(255,255,255,.22); font-size: 11px; line-height: 18px; text-align: center; }
  .embed-btn .n:empty { display: none; }
  .embed-btn.busy { pointer-events: none; opacity: .85; }
  .embed-btn.busy svg { animation: spin .9s linear infinite; }
  .embed-btn.done { background: var(--accent-strong); }
  .embed-btn.failed { background: var(--danger); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  #close-panel { display: none; width: 28px; height: 28px; border-radius: 7px; align-items: center; justify-content: center; color: var(--text-2); }
  #close-panel:hover { background: var(--fill-1); }


  .panel-body { flex: 1; overflow-y: auto; padding: 8px 16px 24px; scrollbar-width: thin; scrollbar-color: #d5ddd4 transparent; }
  .kb-section { margin-top: 18px; }
  /* Table title: a sage band that starts strong on the left and dissolves to the right. */
  .kb-section h3 {
    margin: 0 0 8px; padding: 7px 10px 7px 12px; min-height: 34px;
    display: flex; align-items: center; gap: 8px;
    border-radius: 8px;
    background: linear-gradient(90deg, #d6e5d3 0%, #e4eee1 30%, rgba(237, 243, 235, .55) 65%, rgba(237, 243, 235, 0) 100%);
    font: 650 12.5px/18px var(--sans); color: #34573c; text-transform: uppercase; letter-spacing: .06em;
  }
  .kb-section.removing h3 { background: linear-gradient(90deg, #f3dcd7 0%, #f8e9e6 30%, rgba(250, 238, 235, .5) 65%, rgba(250, 238, 235, 0) 100%); }
  table.kb { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--page); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; table-layout: fixed; }
  table.kb th {
    text-align: left; padding: 7px 10px; background: var(--panel-head);
    font-size: 11.5px; line-height: 16px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    border-bottom: 1px solid var(--line);
  }
  table.kb th.c-topic { width: 32%; }
  table.kb td { padding: 9px 10px; vertical-align: top; font-size: 13px; line-height: 19px; color: var(--text-2); border-bottom: 1px solid var(--line); transition: background .25s, box-shadow .25s; }
  table.kb tr:last-child td { border-bottom: 0; }
  td.c-topic { color: var(--text); font-weight: 500; }
  td.c-topic .id { display: block; margin-top: 2px; font: 11px/15px var(--mono); color: var(--muted); font-weight: 400; overflow-wrap: anywhere; }
  .hits { display: none; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .score { display: inline-block; height: 18px; padding: 0 7px; border-radius: 99px; background: var(--accent); color: #fff; font: 600 11px/18px var(--sans); }
  .score.kw { background: var(--page); color: var(--accent-strong); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 500; }
  tr.in-context td { background: var(--hl) !important; color: var(--text); }
  tr.in-context .hits { display: flex; }

  .panel-empty { padding: 24px 0; color: var(--muted); text-align: center; }

  /* row states: a soft tint for the whole row + a one-word chip (no side bars) */
  table.kb tr td { transition: background .3s, color .3s; }
  .chip {
    display: inline-flex; align-items: center; gap: 3px; width: fit-content;
    height: 18px; margin-bottom: 4px; padding: 0 7px; border-radius: 99px;
    font: 600 10.5px/18px var(--sans); letter-spacing: .03em; text-transform: uppercase; text-decoration: none;
  }
  td.c-topic .chip { display: flex; }
  .chip-new { background: #dfeedd; color: #3f6e48; }
  .chip-edited { background: #f2ead6; color: #86672c; }
  .chip-deleted { background: #f6e1dd; color: #a4483d; }
  .chip-indexing { background: #e9efe8; color: var(--text-2); }
  .chip-indexing::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: var(--accent); animation: pulse 1s infinite ease-in-out; }
  tr.st-indexing td { background: #f8fbf7; }
  .chip-embedded { background: var(--accent); color: #fff; animation: chip-in .35s ease-out; }
  tr.st-new td { background: #f5faf4; }
  tr.st-edited td { background: #fcf9f1; }
  tr.st-deleted td { background: #fdf7f6; }
  tr.st-deleted .t, tr.st-deleted .id { color: #b5a9a6; text-decoration: line-through; text-decoration-color: rgba(164, 72, 61, .45); }
  tr.st-embedded td { animation: row-flash 1.8s ease-out; }
  tr.st-embedded.settle .chip-embedded { animation: chip-out .4s ease-in forwards; }
  @keyframes row-flash { 0% { background: #dbead8; } 100% { background: transparent; } }
  @keyframes chip-in { from { transform: scale(.7); opacity: 0; } }
  @keyframes chip-out { to { opacity: 0; transform: scale(.85); } }
  td.c-topic .t { display: block; }

  /* hover actions: a small floating toolbar at the row's top-right */
  td.c-text { position: relative; }
  .row-actions {
    position: absolute; top: 6px; right: 6px;
    display: flex; gap: 2px; padding: 2px; border-radius: 8px;
    background: rgba(255, 255, 255, .96); border: 1px solid var(--line);
    box-shadow: 0 2px 8px rgba(29, 52, 36, .10);
    opacity: 0; transform: translateY(-2px); pointer-events: none;
    transition: opacity .15s, transform .15s;
  }
  tr:hover .row-actions, .row-actions:focus-within { opacity: 1; transform: none; pointer-events: auto; }
  tr.st-deleted .row-actions { opacity: 1; transform: none; pointer-events: auto; background: transparent; border-color: transparent; box-shadow: none; }
  .act { width: 26px; height: 26px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); }
  .act:hover { background: var(--accent-soft); color: var(--accent-strong); }
  .act[title="Delete"]:hover { background: #f6e1dd; color: var(--danger); }
  svg.i14 { width: 14px; height: 14px; }
  svg.i10 { width: 10px; height: 10px; stroke-width: 2.4; }


  .kb-section h3 .label { min-width: 0; }
  .table-del {
    width: 22px; height: 22px; border-radius: 6px; margin-left: -2px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); opacity: 0; transition: opacity .15s;
  }
  .kb-section:hover .table-del, .table-del:focus-visible { opacity: 1; }
  .table-del:hover { background: var(--fill-2); color: var(--danger); }
  .kb-section.removing h3 .label { text-decoration: line-through; text-decoration-color: rgba(164, 72, 61, .45); color: #b5a9a6; }
  .kb-section h3 .chip { margin: 0; }
  .kb-section.removing .table-del { opacity: 1; color: var(--accent-strong); }
  .kb-section.removing table.kb { opacity: .55; }

  tr.add-row td { padding: 0; }
  .add-btn {
    width: 100%; height: 34px; padding: 0 10px; display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); text-align: left;
    transition: background .15s, color .15s;
  }
  .add-btn:hover { background: var(--accent-soft); color: var(--accent-strong); }
  tr.editor td { background: var(--accent-soft); padding: 8px; }
  .editor textarea, .table-name {
    display: block; width: 100%; max-width: 100%; resize: none; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 6px; background: var(--page);
    padding: 6px 8px; font: 13px/19px var(--sans); color: var(--text); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .editor .ed-q { max-height: 120px; }
  .editor .ed-a { max-height: 200px; }
  .editor textarea { scrollbar-width: thin; scrollbar-color: #cfd9cf transparent; }
  .editor textarea:focus, .table-name:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(111, 146, 117, .15); }
  .editor-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
  .btn-sm { height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600; }
  .btn-sm.primary { background: var(--accent); color: #fff; }
  .btn-sm.primary:hover { background: var(--accent-strong); }
  .btn-sm.primary:disabled { opacity: .45; cursor: default; }
  .btn-sm.ghost { color: var(--text-2); }
  .btn-sm.ghost:hover { background: var(--fill-2); }

  /* bookings view */
  .bk-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .bk-card {
    padding: 10px 12px; border-radius: 10px; background: var(--page); border: 1px solid var(--line);
    font-size: 13px; line-height: 19px; color: var(--text-2); transition: background .25s, border-color .25s;
  }
  .bk-card.hl { background: var(--hl); border-color: #c5d9c1; }
  .bk-card.fresh { animation: row-flash 1.8s ease-out; }
  .bk-card .top { display: flex; align-items: center; gap: 6px; }
  .bk-card .top svg { color: var(--accent); }
  .bk-card .ref { font: 600 12px/19px var(--mono); color: var(--accent-strong); }
  .bk-card .when { margin-left: auto; font-weight: 600; color: var(--text); }
  .bk-card .who { color: var(--muted); overflow-wrap: anywhere; }
  .bk-week { display: flex; align-items: center; gap: 4px; margin: 16px 0 6px; font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .bk-week .svc { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 400; color: var(--muted); }
  .bk-week button { width: 26px; height: 26px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); }
  .bk-week button:hover:not(:disabled) { background: var(--fill-2); }
  .bk-week button:disabled { opacity: .3; cursor: default; }
  svg.flip { transform: scaleX(-1); }
  .bk-grid { background: var(--page); border: 1px solid var(--line); border-radius: 8px; }
  .bk-day { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .bk-day:last-child { border-bottom: 0; }
  .bk-day .d { display: flex; flex-direction: column; font-size: 11.5px; line-height: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .bk-day .d b { font-size: 15px; line-height: 20px; color: var(--text); letter-spacing: 0; }
  .bk-day .times { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; }
  .bk-day.off .times { align-items: center; font-size: 12.5px; color: var(--muted); }
  .bk-day.off .d b { color: var(--muted); }
  .t-chip {
    height: 26px; padding: 0 7px; border-radius: 7px; border: 1px solid var(--line); background: var(--page);
    display: inline-flex; align-items: center; gap: 5px; font: 12px/24px var(--mono); color: var(--text-2);
    transition: border-color .15s, background .15s;
  }
  .t-chip:hover { border-color: var(--accent); }
  .t-chip.hl { background: var(--hl); border-color: #b2cbae; color: var(--text); }
  .t-chip.mine { background: var(--accent); border-color: var(--accent); color: #fff; }
  .t-chip.mine.hl { box-shadow: 0 0 0 3px rgba(111, 146, 117, .3); }
  .bk-note { padding: 18px 0; text-align: center; color: var(--muted); font-size: 13px; }

  .new-table {
    width: 100%; margin-top: 18px; height: 40px; border-radius: 8px;
    border: 1.5px dashed #cfd9cf; color: var(--muted);
    display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px;
    transition: border-color .15s, color .15s, background .15s;
  }
  .new-table:hover { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
  .table-name { max-width: 280px; font-weight: 600; text-transform: none; letter-spacing: 0; }

  /* ── Responsive ───────────────────────────────────────────────────── */
  @media (max-width: 900px) {
    .panel {
      position: fixed; z-index: 50; inset: 0; width: auto !important; margin: 0; border-radius: 0; border: 0;
      transform: translateX(100%); transition: transform .22s ease;
    }
    .frame.panel-open .panel { transform: none; }
    .resize, .panel-tab, #collapse-panel { display: none !important; }
    .frame.panel-collapsed .panel { width: auto !important; opacity: 1; pointer-events: auto; }
    #close-panel, #open-panel, #open-book { display: inline-flex; }
    .dock { padding-bottom: 0; }
    .chin { display: flex; }
  }
  @media (max-width: 640px) {
    .column { padding: 16px 16px 0; }
    .prose p, .prose ul, .prose ol { padding-right: 8px; }
    .column.empty .composer textarea { min-height: 64px; }
    .chips button { height: 36px; font-size: 13.5px; }
    .bfields { grid-template-columns: 1fr; }
    .panel-head { gap: 8px; padding-left: 10px; }
    .views { gap: 2px; }
    .views button { padding: 0 8px; font-size: 13px; }
  }
</style>
</head>

    <svg class="bk-illus" viewBox="0 -2 48 50" aria-hidden="true">

          <circle cx="15.5" cy="21.5" r="1.3" /><circle cx="21.5" cy="21.5" r="1.3" /><circle cx="27.5" cy="21.5" r="1.3" /><circle cx="33.5" cy="21.5" r="1.3" />
          <circle cx="15.5" cy="26.5" r="1.3" /><circle cx="33.5" cy="26.5" r="1.3" />
          <circle cx="21.5" cy="31.5" r="1.3" /><circle cx="27.5" cy="31.5" r="1.3" /><circle cx="33.5" cy="31.5" r="1.3" />

        <rect class="bk-pick" x="18" y="23.2" width="13" height="6.6" rx="2.2" />
        <path class="bk-check" d="M21.7 26.6l1.8 1.7 3.6-3.5" />
      </g>
      <g class="bk-clock">
        <circle cx="10.5" cy="37.5" r="7" />
        <path d="M10.5 37.5v-3.6" />
        <path class="m" d="M10.5 37.5h3.4" />
