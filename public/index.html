    <span class="count" id="book-tab-count"></span>
  </button>
  <div class="resize" id="resize" role="separator" aria-orientation="vertical" aria-label="Resize dataset panel" tabindex="0"></div>

  <!-- Dataset -->
  <aside class="panel" id="panel" data-view="kb" aria-label="Knowledge base and bookings">
    <div class="panel-head">
      <div class="titles views" role="tablist">
        <button type="button" role="tab" data-view="kb" aria-selected="true"><span id="view-kb">Knowledge base</span></button>
        <button type="button" role="tab" data-view="book" aria-selected="false"><span id="view-book">Bookings</span><span class="count" id="bk-count"></span></button>
      </div>
      <button class="embed-btn" id="embed" type="button"><svg class="i"><use href="#i-sparkle"/></svg><span id="embed-label">Embed</span><span class="n" id="embed-n"></span></button>
      <div class="seg" id="seg" role="group" aria-label="Language">
        <span class="thumb" id="seg-thumb" aria-hidden="true"></span>
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      </div>
      <button id="collapse-panel" type="button" aria-label="Collapse panel" title="Collapse"><svg class="i"><use href="#i-collapse"/></svg></button>
      <button id="close-panel" type="button" aria-label="Close dataset"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="panel-body" id="kb"><div class="panel-empty">Loading dataset…</div></div>
    <div class="panel-body" id="bk" hidden></div>
  </aside>
</div>

<script>
  const CATEGORY_LABELS = {
    clinic: { en: "Clinic", fr: "Clinique" },
    services: { en: "Services & prices", fr: "Services et tarifs" },
    faq: { en: "FAQ", fr: "FAQ" },
    policies: { en: "Policies", fr: "Politiques" },
    team: { en: "Team", fr: "Équipe" },
  };
  const T = {
    en: { topic: "Topic", content: "Content", add: "Add question", newTable: "New table", q: "Question", a: "Answer", tableName: "Table name", save: "Add", cancel: "Cancel", embed: "Embed", embedding: "Embedding…", indexing: "Indexing…", embedded: "Embedded", retry: "Retry", saveEdit: "Save", chipNew: "New", chipEdited: "Edited", chipDeleted: "Deleted",
      kbTitle: "Knowledge base", bkTitle: "Bookings", full: "Full", closed: "Closed", loadFailed: "Could not load times.", prevWeek: "Previous week", nextWeek: "Next week" },
    fr: { topic: "Sujet", content: "Contenu", add: "Ajouter une question", newTable: "Nouvelle table", q: "Question", a: "Réponse", tableName: "Nom de la table", save: "Ajouter", cancel: "Annuler", embed: "Intégrer", embedding: "Intégration…", indexing: "Indexation…", embedded: "Intégré", retry: "Réessayer", saveEdit: "Enregistrer", chipNew: "Nouveau", chipEdited: "Modifié", chipDeleted: "Supprimé",
      kbTitle: "Connaissances", bkTitle: "Rendez-vous", full: "Complet", closed: "Fermé", loadFailed: "Impossible de charger les plages.", prevWeek: "Semaine précédente", nextWeek: "Semaine suivante" },
  };
  // Booking form, in the language the assistant chose for it.
  const FT = {
    en: { name: "Full name", phone: "Phone", email: "Email", first: "First visit at the clinic", notes: "Notes (optional)", book: "Book", booked: "Booked",
      pick: "Pick a time.", badName: "Enter your full name.", badPhone: "Enter a valid phone number.", badEmail: "Enter a valid email.",
      request: "Booking request", at: "at", with: "with", for: "for" },
    fr: { name: "Nom complet", phone: "Téléphone", email: "Courriel", first: "Première visite à la clinique", notes: "Notes (facultatif)", book: "Réserver", booked: "Réservé",
      pick: "Choisissez une plage horaire.", badName: "Entrez votre nom complet.", badPhone: "Entrez un numéro de téléphone valide.", badEmail: "Entrez un courriel valide.",
      request: "Demande de réservation", at: "à", with: "avec", for: "pour" },
  };

  const $ = (id) => document.getElementById(id);
  const frame = $("frame"), scroller = $("scroller"), transcript = $("transcript");
  const input = $("input"), sendBtn = $("send"), kbEl = $("kb"), bkEl = $("bk");

  const rand = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
  // Identifies this page's own rows in Vectorize. Like the chat history, a reload starts a new session.
  const sessionId = rand(16);

  // Conversation lives in page memory only; a reload starts fresh.
  const history = [];
  const turns = [];          // { steps, stepsEl, stepEls }: the tool calls of each answer
  let entries = [];          // shared base data from /knowledge
  // Rows added or edited in this session: { id, category, title, text, lang, state, edited?, replaces?, embeddedOnce?, justEmbedded? }
  // state: "pending" (not embedded yet) | "embedded" | "removing"; replaces: the shared vector id it overrides.
  const userRows = [];
  const userTables = [];        // { key, label }
  const baseState = new Map();  // shared vector id ("services-whitening-en") -> "removing" | "hidden"
  const removedOwn = new Set();  // this session's deleted vectors, filtered from search until Vectorize drops them
  const tableState = new Map(); // category key -> "removing" | "hidden"
  let editing = null;           // category key whose add-row editor is open, or "__new_table__"
  let editingRow = null;        // vector id of the row being edited in place
  let kbLang = "en";
  let activeTurn = -1;
  let activeStep = null;        // one step of the active turn, or null for all of them
  let busy = false;
  let panelView = "kb";         // "kb" | "book"
  const bookings = [];          // appointments booked in this chat, like the history kept in page memory
  let catalog = { services: {}, dentists: [] };
  // Bookings view: the service and week shown, the loaded free times, and what the active turn touched.
  const bk = { service: "checkup", week: 0, key: "", data: null, loading: "", failed: "", focus: null, focusSig: "", scroll: false };

  /* ── Dataset panel ─────────────────────────────────────────────── */
  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    for (const c of children) if (c != null) node.append(c);
    return node;
  }
  const icon = (name, cls = "i") => {
    const span = document.createElement("span");
    span.style.display = "contents";
    span.innerHTML = `<svg class="${cls}"><use href="#i-${name}"/></svg>`;
    return span;
  };
  // Grows with the text up to the CSS max-height, then the textarea scrolls.
  function autoGrow(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; }

  const tableRemoving = (key) => tableState.get(key) === "removing";
  const vid = (r) => `${r.id}-${r.lang}`;

  function categories() {
    const keys = [...new Set(entries.map((e) => e.category))];
    return [
      ...keys.map((key) => ({ key, label: CATEGORY_LABELS[key]?.[kbLang] || key, base: true })),
      ...userTables,
    ].filter((c) => tableState.get(c.key) !== "hidden");
  }

  // Shared rows in table order (a session edit takes the shared row's place), then rows added in this session.
  function rowsFor(cat) {
    const rows = [];
    for (const e of entries.filter((e) => e.category === cat)) {
      const v = `${e.id}-${kbLang}`;
      const override = userRows.find((r) => r.replaces === v);
      if (override) rows.push(override);
      else if (baseState.get(v) !== "hidden") rows.push({ id: e.id, category: cat, title: e.title[kbLang], text: e[kbLang], lang: kbLang, base: true });
    }
    rows.push(...userRows.filter((r) => r.category === cat && r.lang === kbLang && !r.replaces));
    return rows;
  }

  function rowStatus(r) {
    if (tableRemoving(r.category)) return "deleted";
    if (r.base) return baseState.get(vid(r)) === "removing" ? "deleted" : "";
    if (r.state === "removing") return "deleted";
    if (r.state === "pending") return r.edited ? "edited" : "new";
    if (r.indexing) return "indexing";
    return r.justEmbedded ? "embedded" : "";
  }

  function actionButton(name, title, onClick) {
    const b = el("button", { className: "act", type: "button", title });
    b.append(icon(name, "i i14"));
    b.onclick = onClick;
    return b;
  }

  function rowEl(r) {
    if (editingRow === vid(r)) return editorRow(r.category, r);
    const t = T[kbLang];
    const status = rowStatus(r);
    const tr = el("tr", { id: `row-${r.id}`, className: status ? `st-${status}` : "" });
    const topic = el("td", { className: "c-topic" });
    const chip = { new: t.chipNew, edited: t.chipEdited, deleted: t.chipDeleted, indexing: t.indexing, embedded: t.embedded }[status];
    if (chip) topic.append(el("span", { className: `chip chip-${status}` }, status === "embedded" ? icon("check", "i i10") : null, chip));
    topic.append(el("span", { className: "t", textContent: r.title }), el("span", { className: "id", textContent: vid(r) }), el("span", { className: "hits" }));

    const content = el("td", { className: "c-text" }, el("span", { className: "t", textContent: r.text }));
    if (!tableRemoving(r.category)) {
      const acts = el("div", { className: "row-actions" });
      if (status === "deleted") acts.append(actionButton("undo", "Undo", () => toggleRemove(r)));
      else {
        acts.append(actionButton("pen", "Edit", () => { editing = null; editingRow = vid(r); renderKnowledge(); }));
        if (status === "edited") acts.append(actionButton("undo", "Discard changes", () => discardEdit(r)));
        else acts.append(actionButton("trash", "Delete", () => toggleRemove(r)));
      }
      content.append(acts);
    }
    tr.append(topic, content);
    return tr;
  }

  // One editor for both adding (row = undefined) and editing an existing row in place.
  function editorRow(cat, row) {
    const t = T[kbLang];
    const q = el("textarea", { className: "ed-q", rows: 1, placeholder: t.q, maxLength: 200, value: row?.title || "" });
    const a = el("textarea", { className: "ed-a", rows: 2, placeholder: t.a, maxLength: 1500, value: row?.text || "" });
    const save = el("button", { className: "btn-sm primary", type: "button", textContent: row ? t.saveEdit : t.save, disabled: true });
    const cancel = el("button", { className: "btn-sm ghost", type: "button", textContent: t.cancel });
    const sync = () => {
      const title = q.value.trim(), text = a.value.trim();
      save.disabled = !title || !text || (!!row && title === row.title && text === row.text);
    };
    const close = () => { editing = null; editingRow = null; renderKnowledge(); };
    const submit = () => {
      if (save.disabled) return;
      const title = q.value.trim(), text = a.value.trim();
      if (!row) {
        userRows.push({ id: `s-${sessionId}-${rand(8)}`, category: cat, title, text, lang: kbLang, state: "pending" });
        updateEmbedButton();
        openEditor(cat); // keep adding rows to the same table
        return;
      }
      if (row.base) {
        // Your own copy replaces the shared row for this session once embedded.
        userRows.push({ id: `s-${sessionId}-${rand(8)}`, category: cat, title, text, lang: row.lang, state: "pending", edited: true, replaces: vid(row), original: { title: row.title, text: row.text } });
      } else if (row.state === "pending" && !row.edited) {
        Object.assign(row, { title, text });
      } else {
        Object.assign(row, { original: row.original || { title: row.title, text: row.text }, title, text, state: "pending", edited: true });
      }
      editingRow = null;
      renderKnowledge();
      renderBookings();
      viewLabels();
      updateEmbedButton();
    };
    for (const ta of [q, a]) {
      ta.addEventListener("input", () => { autoGrow(ta); sync(); });
      ta.addEventListener("keydown", (e) => {
        if (e.key === "Escape") close();
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
        if (e.key === "Enter" && !e.shiftKey && ta === q) { e.preventDefault(); a.focus(); }
      });
    }
    save.onclick = submit;
    cancel.onclick = close;
    requestAnimationFrame(() => { autoGrow(q); autoGrow(a); });
    return el("tr", { className: "editor", id: row ? `row-${row.id}` : "" },
      el("td", {}, q),
      el("td", {}, a, el("div", { className: "editor-actions" }, cancel, save)),
    );
  }

  function openEditor(cat) {
    editing = cat;
    editingRow = null;
    renderKnowledge();
    kbEl.querySelector("tr.editor")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function newTableForm() {
    const t = T[kbLang];
    const name = el("input", { className: "table-name", placeholder: t.tableName, maxLength: 40 });
    const done = () => {
      const label = name.value.trim();
      if (!label) { editing = null; renderKnowledge(); return; }
      const key = `t-${label.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || rand(6)}`;
      if (!categories().some((c) => c.key === key)) userTables.push({ key, label });
      tableState.delete(key);
      openEditor(key);
    };
    name.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); done(); }
      if (e.key === "Escape") { editing = null; renderKnowledge(); }
    });
    name.addEventListener("blur", () => { if (!name.value.trim()) { editing = null; renderKnowledge(); } });
    return el("section", { className: "kb-section" }, el("h3", {}, name));
  }

  function tableHeading(key, label) {
    const removing = tableRemoving(key);
    const del = el("button", { className: "table-del", type: "button", title: removing ? "Undo" : "Delete table" });
    del.append(icon(removing ? "undo" : "trash", "i i12"));
    del.onclick = () => toggleTable(key);
    const h = el("h3", {}, el("span", { className: "label", textContent: label }));
    if (removing) h.append(el("span", { className: "chip chip-deleted", textContent: T[kbLang].chipDeleted }));
    h.append(del);
    return h;
  }

  function renderKnowledge(scroll = false) {
    const keepScroll = kbEl.scrollTop;
    kbEl.textContent = "";
    if (!entries.length) { kbEl.append(el("div", { className: "panel-empty", textContent: "—" })); return; }
    const t = T[kbLang];
    for (const { key, label } of categories()) {
      const body = el("tbody");
      for (const r of rowsFor(key)) body.append(rowEl(r));
      if (editing === key) body.append(editorRow(key));
      else if (!tableRemoving(key)) {
        const add = el("button", { className: "add-btn", type: "button" }, icon("plus"), t.add);
        add.onclick = () => openEditor(key);
        body.append(el("tr", { className: "add-row" }, el("td", { colSpan: 2 }, add)));
      }
      const head = el("tr", {}, el("th", { className: "c-topic", textContent: t.topic }), el("th", { textContent: t.content }));
      kbEl.append(el("section", { className: `kb-section${tableRemoving(key) ? " removing" : ""}` },
        tableHeading(key, label),
        el("table", { className: "kb" }, el("thead", {}, head), body),
      ));
    }
    if (editing === "__new_table__") kbEl.append(newTableForm());
    else {
      const nt = el("button", { className: "new-table", type: "button" }, icon("plus"), t.newTable);
      nt.onclick = () => { editing = "__new_table__"; editingRow = null; renderKnowledge(); kbEl.scrollTo({ top: kbEl.scrollHeight, behavior: "smooth" }); };
      kbEl.append(nt);
    }
    kbEl.scrollTop = keepScroll;
    // Focus synchronously so keystrokes typed right after a click are never lost.
    const field = kbEl.querySelector("tr.editor textarea, .table-name");
    if (field) {
      field.focus({ preventScroll: true });
      field.setSelectionRange?.(field.value.length, field.value.length);
    }
    applyHighlight(scroll);
  }

  // Deleting and editing only mark rows; the Embed button applies the changes.
  function toggleRemove(r) {
    if (r.base) {
      const v = vid(r);
      if (baseState.get(v) === "removing") baseState.delete(v);
      else baseState.set(v, "removing");
    } else if (r.state === "pending" && !r.embeddedOnce && !r.replaces) {
      userRows.splice(userRows.indexOf(r), 1); // never embedded: just drop it
    } else {
      r.state = r.state === "removing" ? "embedded" : "removing";
    }
    renderKnowledge();
    updateEmbedButton();
  }

  function discardEdit(r) {
    if (!r.embeddedOnce) userRows.splice(userRows.indexOf(r), 1); // the shared row comes back
    else Object.assign(r, r.original, { state: "embedded", edited: false, original: undefined });
    renderKnowledge();
    updateEmbedButton();
  }

  function toggleTable(key) {
    if (tableRemoving(key)) tableState.delete(key);
    else {
      const isUserTable = userTables.some((t) => t.key === key);
      const hasEmbedded = userRows.some((r) => r.category === key && r.embeddedOnce);
      if (isUserTable && !hasEmbedded) {
        // Nothing of it is in Vectorize yet: remove it right away.
        userTables.splice(userTables.findIndex((t) => t.key === key), 1);
        for (let i = userRows.length - 1; i >= 0; i--) if (userRows[i].category === key) userRows.splice(i, 1);
      } else tableState.set(key, "removing");
      if (editing === key) editing = null;
      editingRow = null;
    }
    renderKnowledge();
    updateEmbedButton();
  }

  /* ── Embed changes into Vectorize ──────────────────────────────── */
  const embedBtn = $("embed");
  function pendingChanges() {
    const inRemovedTable = (r) => tableRemoving(r.category);
    const upsert = userRows.filter((r) => r.state === "pending" && !inRemovedTable(r));
    const deletedBase = entries.flatMap((e) => ["en", "fr"].map((lang) => ({ e, v: `${e.id}-${lang}` })))
      .filter(({ e, v }) => baseState.get(v) !== "hidden" && (baseState.get(v) === "removing" || tableRemoving(e.category)))
      .map(({ v }) => v);
    const replaced = userRows.filter((r) => r.replaces && baseState.get(r.replaces) !== "hidden").map((r) => r.replaces);
    return {
      upsert,
      discard: userRows.filter((r) => !r.embeddedOnce && inRemovedTable(r)),
      remove: userRows.filter((r) => r.embeddedOnce && (r.state === "removing" || inRemovedTable(r))),
      deletedBase,
      hide: [...new Set([...deletedBase, ...replaced])],
      tables: [...tableState].filter(([, st]) => st === "removing").map(([key]) => key),
    };
  }
  const changeCount = (c) => c.upsert.length + c.discard.length + c.remove.length + c.deletedBase.length;
  function updateEmbedButton() {
    if (embedBtn.classList.contains("busy") || embedBtn.classList.contains("done")) return;
    const n = changeCount(pendingChanges());
    embedBtn.classList.toggle("show", n > 0);
    embedBtn.classList.remove("failed");
    $("embed-label").textContent = T[kbLang].embed;
    $("embed-n").textContent = n;
  }
  // Vectorize indexes writes in the background (measured: about 1–2 minutes, whatever the batch size).
  // Each saved row shows "Indexing" until a real search returns its latest text, then flashes "Embedded".
  // Batches are tracked separately, so several can index at the same time.
  async function watchIndexing(rows, rev) {
    const ids = rows.map(vid);
    const until = Date.now() + 300_000;
    let ready = false;
    while (!ready && Date.now() < until) {
      await new Promise((r) => setTimeout(r, 4000));
      try {
        const res = await fetch("/embed/status", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessionId, ids, rev }) });
        ready = (await res.json()).ready === true;
      } catch {}
    }
    const mine = rows.filter((r) => r.rev === rev); // a newer edit of the row has its own watcher
    mine.forEach((r) => { r.indexing = false; r.justEmbedded = ready; });
    renderKnowledge();
    if (ready) setTimeout(() => {
      mine.forEach((r) => { r.justEmbedded = false; $(`row-${r.id}`)?.classList.add("settle"); });
    }, 1800);
  }
  embedBtn.onclick = async () => {
    const c = pendingChanges();
    if (!changeCount(c)) return;
    embedBtn.classList.remove("failed");
    embedBtn.classList.add("busy");
    $("embed-label").textContent = T[kbLang].embedding;
    $("embed-n").textContent = "";
    try {
      // Shared rows are never deleted from the index; hiding them only filters this session's searches.
      let rev = "";
      if (c.upsert.length || c.remove.length) {
        const res = await fetch("/embed", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sessionId,
            upsert: c.upsert.map((r) => ({ id: vid(r), category: r.category, title: r.title, text: r.text, lang: r.lang })),
            remove: c.remove.map(vid),
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        rev = data.rev;
      }
      c.upsert.forEach((r) => Object.assign(r, { state: "embedded", edited: false, embeddedOnce: true, original: undefined, indexing: true, rev }));
      c.remove.forEach((r) => removedOwn.add(vid(r)));
      for (const r of [...c.remove, ...c.discard]) userRows.splice(userRows.indexOf(r), 1);
      c.hide.forEach((v) => baseState.set(v, "hidden"));
      for (const key of c.tables) {
        const i = userTables.findIndex((t) => t.key === key);
        if (i >= 0) { userTables.splice(i, 1); tableState.delete(key); }
        else tableState.set(key, "hidden");
      }
      if (c.upsert.length) watchIndexing(c.upsert, rev);
      embedBtn.classList.remove("busy");
      embedBtn.classList.add("done");
      embedBtn.querySelector("use").setAttribute("href", "#i-check");
      $("embed-label").textContent = T[kbLang].embedded;
      renderKnowledge();
      setTimeout(() => {
        c.upsert.forEach((r) => { r.justEmbedded = false; });
        kbEl.querySelectorAll("tr.st-embedded").forEach((tr) => tr.classList.add("settle"));
        embedBtn.classList.remove("done");
        embedBtn.querySelector("use").setAttribute("href", "#i-sparkle");
        updateEmbedButton();
      }, 1800);
    } catch (err) {
      embedBtn.classList.remove("busy");
      embedBtn.classList.add("failed");
      embedBtn.title = err.message;
      $("embed-label").textContent = T[kbLang].retry;
      $("embed-n").textContent = changeCount(c);
    }
  };

  /* ── Language switch: the toggle's thumb stretches like liquid toward the new side,
        and the tables flow out one side and in from the other. ─────────── */
  const seg = $("seg"), thumb = $("seg-thumb");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function moveThumb(lang, animate = true) {
    const btn = seg.querySelector(`button[data-lang="${lang}"]`);
    const left = btn.offsetLeft, right = seg.clientWidth - btn.offsetLeft - btn.offsetWidth;
    const goingRight = left > thumb.offsetLeft;
    // Leading edge moves first and fast, trailing edge catches up: a short "stretch" then settle.
    thumb.style.transition = !animate || reduceMotion ? "none" : goingRight
      ? "right .28s cubic-bezier(.3,.7,.2,1), left .46s cubic-bezier(.5,0,.15,1) .06s"
      : "left .28s cubic-bezier(.3,.7,.2,1), right .46s cubic-bezier(.5,0,.15,1) .06s";
    thumb.style.left = left + "px";
    thumb.style.right = right + "px";
    seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  }

  let langSwitch = Promise.resolve();
  function setLang(lang, after) {
    langSwitch = langSwitch.then(async () => {
      if (lang === kbLang) { after?.(); return; }
      const dir = lang === "fr" ? -1 : 1; // toward FR the content flows left, toward EN it flows right
      moveThumb(lang);
      if (!reduceMotion) {
        const out = (panelView === "kb" ? kbEl : bkEl).animate(
          [{ transform: "translateX(0)", opacity: 1, filter: "blur(0)" }, { transform: `translateX(${dir * 28}px)`, opacity: 0, filter: "blur(3px)" }],
          { duration: 170, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" },
        );
        await out.finished.catch(() => {});
        out.cancel();
      }
      kbLang = lang;
      editing = null;
      editingRow = null;
      renderKnowledge();
      updateEmbedButton();
      if (!reduceMotion) {
        (panelView === "kb" ? kbEl : bkEl).animate(
          [{ transform: `translateX(${-dir * 40}px)`, opacity: 0, filter: "blur(3px)" }, { transform: "translateX(0)", opacity: 1, filter: "blur(0)" }],
          { duration: 460, easing: "cubic-bezier(.2,1.15,.35,1)" },
        );
      }
      after?.();
    });
    return langSwitch;
  }

  /* ── Highlights: what the active turn's tool calls touched ─────── */
  const isKbStep = (s) => s.tool === "semantic_search" || s.tool === "keyword_search";
  function focusedSteps() {
    const t = turns[activeTurn];
    if (!t) return [];
    return activeStep == null ? t.steps : [t.steps[activeStep]];
  }

  // Selecting a turn (or one of its steps) shows the view that step used: knowledge base or bookings.
  function selectTurn(i, k = null, open = false) {
    activeTurn = i;
    activeStep = k;
    const steps = focusedSteps();
    if (steps.length) setView(isKbStep(steps.at(-1)) ? "kb" : "book");
    applyHighlight(true);
    if (open && steps.length && window.matchMedia("(max-width: 900px)").matches) frame.classList.add("panel-open");
  }

  function ping(tab) { tab.classList.remove("ping"); void tab.offsetWidth; tab.classList.add("ping"); }

  function applyHighlight(scroll = true) {
    kbEl.querySelectorAll("tr.in-context").forEach((r) => r.classList.remove("in-context"));
    turns.forEach((t, i) => {
      t.stepsEl?.classList.toggle("active", i === activeTurn);
      t.stepEls.forEach((b, k) => {
        const open = i === activeTurn && k === activeStep;
        b.classList.toggle("open", open);
        b.querySelector(".step-head")?.setAttribute("aria-expanded", String(open));
      });
    });
    const steps = focusedSteps();
    const collapsed = frame.classList.contains("panel-collapsed");

    // Knowledge-base rows: best similarity score and every keyword they matched.
    const hits = new Map();
    for (const s of steps.filter(isKbStep)) {
      for (const h of s.hits) {
        const prev = hits.get(h.id) || { id: h.id, matched: [] };
        if (h.score !== undefined) prev.score = Math.max(prev.score ?? 0, h.score);
        if (h.matched) prev.matched = [...new Set([...prev.matched, ...h.matched])];
        hits.set(h.id, prev);
      }
    }
    $("ctx-count").textContent = hits.size || "";
    $("tab-count").textContent = hits.size || "";
    if (hits.size && collapsed) ping($("panel-tab"));

    // Schedule: the times the assistant checked or offered, and the booking it made.
    const sig = `${activeTurn}:${activeStep}:${turns[activeTurn]?.steps.length}`;
    if (sig !== bk.focusSig) {
      bk.focusSig = sig;
      bk.focus = bookingFocus(steps);
      if (bk.focus) {
        bk.service = bk.focus.service;
        bk.week = weekOf(bk.focus.date);
        bk.scroll = scroll;
        if (collapsed) ping($("book-tab"));
      }
    }
    renderBookings();
    if (!hits.size) return;

    // Show the language the passages were retrieved in.
    const langs = new Set([...hits.keys()].map((id) => id.slice(-2)));
    if (langs.size === 1) {
      const l = [...langs][0];
      if (l !== kbLang) {
        setLang(l, () => applyHighlight(scroll));
        return;
      }
    }
    let first = null;
    for (const h of [...hits.values()].sort((a, b) => (b.score ?? 0) - (a.score ?? 0))) {
      const row = $(`row-${h.id.replace(/-(en|fr)$/, "")}`);
      if (!row) continue;
      row.classList.add("in-context");
      const pills = h.matched.map((m) => el("span", { className: "score kw", textContent: m }));
      if (h.score !== undefined) pills.unshift(el("span", { className: "score", textContent: h.score.toFixed(2) }));
      row.querySelector(".hits").replaceChildren(...pills);
      first ||= row;
    }
    if (scroll && first && panelView === "kb") first.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  /* ── Panel views ───────────────────────────────────────────────── */
  function setView(view) {
    panelView = view;
    panel.dataset.view = view;
    document.querySelectorAll(".views button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === view)));
    kbEl.hidden = view !== "kb";
    bkEl.hidden = view !== "book";
    renderBookings();
  }
  function viewLabels() {
    $("view-kb").textContent = T[kbLang].kbTitle;
    $("view-book").textContent = T[kbLang].bkTitle;
  }

  /* ── Bookings view ─────────────────────────────────────────────── */
  const DAY_MS = 864e5;
  const clinicToday = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Montreal" }).format(new Date());
  const addDaysTo = (d, n) => new Date(Date.parse(`${d}T00:00:00Z`) + n * DAY_MS).toISOString().slice(0, 10);
  const weekOf = (d) => Math.max(0, Math.floor((Date.parse(`${d}T00:00:00Z`) - Date.parse(`${clinicToday()}T00:00:00Z`)) / DAY_MS / 7));
  const fmtDay = (d, lang, opts) => new Date(`${d}T12:00:00Z`).toLocaleDateString(lang === "fr" ? "fr-CA" : "en-CA", { timeZone: "UTC", ...opts });
  const serviceName = (id, lang) => catalog.services[id]?.[lang] || id;
  const dentistName = (id) => catalog.dentists.find((d) => d.id === id)?.name || id;
  const heldBookings = () => bookings.map(({ ref, service, date, time, dentist }) => ({ ref, service, date, time, dentist }));

  function bookingFocus(steps) {
    let focus = null;
    for (const s of steps) {
      if (s.tool === "check_availability" || s.tool === "show_booking_form") {
        focus ||= { keys: new Set() };
        focus.service = s.service;
        s.slots.forEach((x) => focus.keys.add(`${x.date}|${x.time}|${x.dentist}`));
        const d = s.slots[0]?.date || s.from;
        if (!focus.date || d < focus.date) focus.date = d;
      } else if (s.tool === "book_appointment" && s.booking) {
        focus ||= { keys: new Set() };
        Object.assign(focus, { service: s.booking.service, date: s.booking.date, ref: s.booking.ref });
      }
    }
    return focus;
  }

  function addBooking(b) {
    const entry = { ...b, fresh: true };
    bookings.push(entry);
    setTimeout(() => { entry.fresh = false; }, 2000);
    const n = bookings.length;
    $("bk-count").textContent = n;
    $("book-tab-count").textContent = n;
    $("book-pill-count").textContent = n;
  }

  async function loadAvailability(key, from) {
    bk.loading = key;
    try {
      const res = await fetch("/availability", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ service: key.split("|")[0], from, bookings: heldBookings() }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      if (bk.loading === key) Object.assign(bk, { key, data });
    } catch {
      if (bk.loading === key) bk.failed = key;
    }
    if (bk.loading === key) {
      bk.loading = "";
      renderBookings();
    }
  }

  function bookingCard(b) {
    return el("div", { id: `bk-${b.ref}`, className: `bk-card${bk.focus?.ref === b.ref ? " hl" : ""}${b.fresh ? " fresh" : ""}` },
      el("div", { className: "top" }, icon("check", "i i14"), el("span", { className: "ref", textContent: b.ref }),
        el("span", { className: "when", textContent: `${fmtDay(b.date, kbLang, { weekday: "short", month: "short", day: "numeric" })} · ${b.time}` })),
      el("div", { className: "who", textContent: `${serviceName(b.service, kbLang)} · ${dentistName(b.dentist)} · ${b.name}` }));
  }

  // Clicking a free time drafts the request in the composer; the assistant does the booking.
  function draftBooking(date, time, dentists) {
    const t = FT[kbLang];
    const day = fmtDay(date, kbLang, { weekday: "long", month: "long", day: "numeric" });
    const who = dentists.length === 1 ? ` ${t.with} ${dentistName(dentists[0])}` : "";
    input.value = kbLang === "fr"
      ? `Je voudrais réserver : ${serviceName(bk.service, "fr")}, ${day} à ${time}${who}.`
      : `I'd like to book: ${serviceName(bk.service, "en")}, ${day} at ${time}${who}.`;
    autosize();
    frame.classList.remove("panel-open");
    input.focus();
  }

  function availabilityGrid(from, key) {
    const t = T[kbLang];
    if (bk.key !== key) return el("div", { className: "bk-note", textContent: bk.failed === key ? t.loadFailed : "…" });
    const grid = el("div", { className: "bk-grid" });
    for (let i = 0; i < 7; i++) {
      const date = addDaysTo(from, i);
      const free = bk.data.slots.filter((s) => s.date === date);
      const mine = bookings.filter((b) => b.date === date);
      const times = [...new Set([...free.map((s) => s.time), ...mine.map((b) => b.time)])].sort();
      const cell = el("div", { className: "times" });
      if (!times.length) cell.textContent = bk.data.closed.includes(date) ? t.closed : t.full;
      for (const time of times) {
        const own = mine.find((b) => b.time === time);
        const ds = free.filter((s) => s.time === time).map((s) => s.dentist);
        const hl = own ? bk.focus?.ref === own.ref : ds.some((d) => bk.focus?.keys.has(`${date}|${time}|${d}`));
        const chip = el("button", {
          type: "button",
          className: `t-chip${own ? " mine" : ""}${hl ? " hl" : ""}`,
          title: own ? `${own.ref} · ${serviceName(own.service, kbLang)} · ${dentistName(own.dentist)}` : ds.map(dentistName).join(", "),
        });
        if (own) {
          chip.append(icon("check", "i i10"), time);
          chip.onclick = () => $(`bk-${own.ref}`)?.scrollIntoView({ block: "center", behavior: "smooth" });
        } else {
          chip.append(time);
          chip.onclick = () => draftBooking(date, time, ds);
        }
        cell.append(chip);
      }
      grid.append(el("div", { className: `bk-day${times.length ? "" : " off"}` },
        el("div", { className: "d" }, fmtDay(date, kbLang, { weekday: "short" }), el("b", { textContent: fmtDay(date, kbLang, { day: "numeric" }) })),
        cell));
    }
    return grid;
  }

  function renderBookings() {
    if (panelView !== "book") return;
    const t = T[kbLang];
    const from = addDaysTo(clinicToday(), bk.week * 7);
    const key = `${bk.service}|${from}|${bookings.length}`;
    if (bk.key !== key && bk.loading !== key && bk.failed !== key && catalog.dentists.length) loadAvailability(key, from);

    const prev = el("button", { type: "button", title: t.prevWeek, disabled: bk.week === 0 }, icon("chevron", "i i14 flip"));
    const next = el("button", { type: "button", title: t.nextWeek, disabled: bk.week >= 7 }, icon("chevron", "i i14"));
    prev.onclick = () => { bk.week--; renderBookings(); };
    next.onclick = () => { bk.week++; renderBookings(); };
    const short = { month: "short", day: "numeric" };
    const week = el("div", { className: "bk-week" }, prev,
      el("span", { textContent: `${fmtDay(from, kbLang, short)} – ${fmtDay(addDaysTo(from, 6), kbLang, short)}` }), next,
      el("span", { className: "svc", textContent: serviceName(bk.service, kbLang) }));
    const list = bookings.length ? el("div", { className: "bk-list" }, ...[...bookings].reverse().map(bookingCard)) : null;

    const keepScroll = bkEl.scrollTop;
    bkEl.replaceChildren(...[list, week, availabilityGrid(from, key)].filter(Boolean));
    bkEl.scrollTop = keepScroll;
    if (bk.scroll && bk.key === key) {
      bk.scroll = false;
      bkEl.querySelector(".bk-card.hl, .t-chip.hl")?.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }

  /* ── Messages ──────────────────────────────────────────────────── */
  function inline(text) {
    // **bold** → <strong>, *italic* → <em>, everything else as text nodes.
    const frag = document.createDocumentFragment();
    text.split(/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/g).forEach((part) => {
      if (/^\*\*[^*]+\*\*$/.test(part)) frag.append(el("strong", { textContent: part.slice(2, -2) }));
      else if (/^\*[^*]+\*$/.test(part)) frag.append(el("em", { textContent: part.slice(1, -1) }));
      else if (part) frag.append(part);
    });
    return frag;
  }

  // Paragraphs, "- " bullets and "1." lists; a list may follow an intro line in the same block.
  function renderAnswer(text) {
    const prose = el("div", { className: "prose" });
    const bullet = /^[-•*]\s+/, numbered = /^\d+[.)]\s+/;
    for (const block of text.trim().split(/\n\s*\n/)) {
      let para = null, list = null;
      for (const line of block.split("\n").map((l) => l.trim()).filter(Boolean)) {
        const kind = bullet.test(line) ? "ul" : numbered.test(line) ? "ol" : "p";
        if (kind === "p") {
          list = null;
          if (para) para.append(el("br"));
          else prose.append((para = el("p")));
          para.append(inline(line));
        } else {
          para = null;
          if (list?.tagName.toLowerCase() !== kind) prose.append((list = el(kind)));
          list.append(el("li", {}, inline(line.replace(kind === "ul" ? bullet : numbered, ""))));
        }
      }
    }
    return prose;
  }

  function addUser(text) {
    const add = () => {
      $("column").classList.remove("empty");
      autosize(); // back to a one-line input at the bottom
      transcript.append(el("article", { className: "turn-user" }, el("div", { className: "bubble", textContent: text })));
    };
    // First message: the centered input glides down to its place at the bottom.
    // Resolves once the message is in the DOM, so the reply is always added after it.
    if ($("column").classList.contains("empty") && document.startViewTransition && !reduceMotion) {
      return document.startViewTransition(add).updateCallbackDone.catch(add);
    }
    add();
    return Promise.resolve();
  }

  function addBotPending() {
    const art = el("article", { className: "turn-bot" });
    art.append(el("div", { className: "status loading" }, el("span", { className: "dot" }), el("span", { textContent: "Thinking…" })));
    art.append(el("div", { className: "typing" }, el("span"), el("span"), el("span")));
    transcript.append(art);
    return art;
  }

  // One line per tool call, in the order the model made them; clicking one highlights what it touched.
  const STEP_ICON = { semantic_search: "vector", keyword_search: "quote", check_availability: "calendar", show_booking_form: "form", book_appointment: "check" };
  // A step built from the arguments the model sent, shown while the tool is still running.
  const stepFromArgs = (tool, a = {}) => ({ tool, query: a.query, keywords: a.keywords, service: a.service, from: a.date_from, to: a.date_to, dentist: a.dentist, partOfDay: a.part_of_day });
  function stepArg(s, lang) {
    const short = { month: "short", day: "numeric" };
    if (s.tool === "semantic_search") return s.query ? `"${s.query}"` : "";
    if (s.tool === "keyword_search") return (s.keywords || []).join(" · ");
    if (s.tool === "check_availability") {
      return [s.service && serviceName(s.service, lang), s.from && s.to && `${fmtDay(s.from, lang, short)} – ${fmtDay(s.to, lang, short)}`,
        s.dentist && dentistName(s.dentist), s.partOfDay].filter(Boolean).join(" · ");
    }
    if (s.tool === "show_booking_form") return s.service ? serviceName(s.service, lang) : "";
    if (s.tool === "book_appointment") return s.booking ? `${s.booking.ref} · ${fmtDay(s.booking.date, lang, short)} ${s.booking.time}` : s.error || "";
    return "";
  }
  // What a step looked at and what it returned, shown when the step is expanded.
  function stepDetails(s, lang) {
    const box = el("div", { className: "sd" });
    const arg = stepArg(s, lang);
    if (arg) box.append(el("div", { className: "sd-arg", textContent: arg }));
    const row = (k, v) => el("div", { className: "sd-row" }, el("span", { className: "k", textContent: k }), el("span", { className: "v", textContent: v }));
    if (s.hits) {
      if (!s.hits.length) box.append(el("div", { className: "sd-none", textContent: "—" }));
      for (const h of s.hits) box.append(row(h.title, h.score != null ? h.score.toFixed(2) : (h.matched || []).join(", ")));
    }
    if (s.slots) {
      const days = new Map();
      for (const x of s.slots) days.set(x.date, [...(days.get(x.date) || []), x.time]);
      if (!days.size) box.append(el("div", { className: "sd-none", textContent: "—" }));
      for (const [date, times] of days) box.append(row(fmtDay(date, lang, { weekday: "short", month: "short", day: "numeric" }), [...new Set(times)].join("  ")));
    }
    if (s.booking) box.append(row(`${serviceName(s.booking.service, lang)} · ${dentistName(s.booking.dentist)}`, s.booking.name));
    return box;
  }

  function stepEl(s, lang, running = false) {
    const head = el("button", { type: "button", className: "step-head" },
      el("span", { className: "spin" }), icon(STEP_ICON[s.tool] || "sparkle", "i i14"),
      el("span", { className: "tool", textContent: s.tool }), icon("chevron", "i chev"));
    const step = el("div", { className: `step${s.error ? " err" : ""}${running ? " running enter" : ""}` }, head);
    if (!running) {
      head.setAttribute("aria-expanded", "false");
      step.append(el("div", { className: "step-body" }, el("div", {}, stepDetails(s, lang))));
    }
    return step;
  }

  function bookingFormEl(f) {
    const t = FT[f.lang] || FT.en;
    const group = `slot-${rand(8)}`;
    const form = el("form", { className: "bform", noValidate: true });
    form.dataset.lang = f.lang;
    const svc = catalog.services[f.service];
    const slots = el("div", { className: "bslots", role: "radiogroup" });
    f.slots.forEach((s, k) => {
      slots.append(el("label", { className: "bslot" },
        el("input", { type: "radio", name: group, value: String(k) }),
        el("span", {}, el("b", { textContent: `${fmtDay(s.date, f.lang, { weekday: "short", month: "short", day: "numeric" })} · ${s.time}` }),
          el("small", { textContent: dentistName(s.dentist) }))));
    });
    const name = el("input", { placeholder: t.name, autocomplete: "name", maxLength: 80 });
    const phone = el("input", { type: "tel", placeholder: t.phone, autocomplete: "tel", maxLength: 30 });
    const email = el("input", { type: "email", placeholder: t.email, autocomplete: "email", maxLength: 120, className: "wide" });
    const notes = el("textarea", { rows: 1, placeholder: t.notes, maxLength: 300, className: "wide" });
    const first = el("input", { type: "checkbox" });
    [name, phone, email, notes].forEach((x) => x.setAttribute("aria-label", x.placeholder));
    const err = el("span", { className: "err", role: "alert" });
    const btn = el("button", { className: "bbtn", type: "submit", textContent: t.book });
    form.append(
      el("div", { className: "bform-head" }, icon("calendar"), el("span", { textContent: serviceName(f.service, f.lang) }), svc ? el("span", { className: "dur", textContent: `· ${svc.minutes} min` }) : null),
      slots,
      el("div", { className: "bfields" }, name, phone, email, notes),
      el("div", { className: "bfoot" }, el("label", { className: "bcheck" }, first, t.first), err, btn),
    );
    form.onsubmit = (e) => {
      e.preventDefault();
      if (busy || form.classList.contains("sent")) return;
      const k = form.querySelector(`input[name="${group}"]:checked`)?.value;
      const phoneOk = /^[\d\s()+.-]+$/.test(phone.value.trim()) && phone.value.replace(/\D/g, "").length >= 7;
      err.textContent = k == null ? t.pick
        : name.value.trim().length < 2 ? t.badName
        : !phoneOk ? t.badPhone
        : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim()) ? t.badEmail : "";
      if (err.textContent) return;
      const s = f.slots[+k];
      const bookingForm = { ...s, service: f.service, name: name.value.trim(), phone: phone.value.trim(), email: email.value.trim(), newPatient: first.checked, notes: notes.value.trim() };
      const day = fmtDay(s.date, f.lang, { weekday: "long", month: "long", day: "numeric" });
      setFormState(form, "sent");
      send(`${t.request}: ${serviceName(f.service, f.lang)}, ${day} ${t.at} ${s.time} ${t.with} ${dentistName(s.dentist)}, ${t.for} ${bookingForm.name}.`,
        { bookingForm, lang: f.lang, formEl: form });
    };
    return form;
  }

  function setFormState(form, state) {
    form.classList.toggle("sent", state !== "open");
    form.classList.toggle("booked", state === "booked");
    form.querySelectorAll("input, textarea, button").forEach((x) => { x.disabled = state !== "open"; });
    if (state === "booked") form.querySelector(".bbtn").replaceChildren(icon("check", "i i14"), FT[form.dataset.lang]?.booked || FT.en.booked);
  }

  function confirmEl(b, lang, i) {
    const btn = el("button", { type: "button", className: "bconfirm" },
      el("span", { className: "tick" }, icon("check")),
      el("span", { className: "txt" },
        el("span", { className: "what" }, el("b", { textContent: b.ref }), serviceName(b.service, lang)),
        el("span", { className: "when", textContent: `${fmtDay(b.date, lang, { weekday: "long", month: "long", day: "numeric" })} · ${b.time} · ${dentistName(b.dentist)}` })));
    btn.onclick = () => {
      const k = turns[i].steps.findIndex((s) => s.tool === "book_appointment");
      selectTurn(i, k >= 0 ? k : null, true);
    };
    return btn;
  }

  function buildSteps(i, steps, lang) {
    const turn = turns[i];
    turn.stepEls = steps.map((s, k) => {
      const b = stepEl(s, lang);
      b.querySelector(".step-head").onclick = () => selectTurn(i, activeTurn === i && activeStep === k ? null : k);
      return b;
    });
    turn.stepsEl = steps.length ? el("div", { className: "steps" }, ...turn.stepEls) : null;
    return turn.stepsEl;
  }

  function finishBot(art, data, ctx = {}) {
    art.textContent = "";
    const steps = data.steps || [];
    const lang = ctx.lang || data.form?.lang || steps.find((s) => s.lang)?.lang || "en";
    const i = ctx.turn ?? turns.length;
    turns[i] = { steps, stepsEl: null, stepEls: [] };
    const stepsEl = buildSteps(i, steps, lang);
    if (stepsEl) art.append(stepsEl);
    art.append(renderAnswer(data.answer || "…"));
    if (data.booking) {
      addBooking(data.booking);
      art.append(confirmEl(data.booking, lang, i));
    }
    if (ctx.formEl) setFormState(ctx.formEl, data.booking ? "booked" : "sent");
    if (data.form) art.append(bookingFormEl(data.form));
    selectTurn(i, null, false);
  }

  function failBot(art, message) {
    art.textContent = "";
    art.append(el("div", { className: "prose error", textContent: message }));
  }

  // Keeps the newest text in view while it streams, unless the reader scrolled up.
  function stickToBottom() {
    if (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 160) scroller.scrollTop = scroller.scrollHeight;
  }

  // The reply as it happens: each tool call appears when it starts and settles when it returns,
  // its rows light up in the panel, then the answer is written word by word.
  function liveTurn(art, lang) {
    const i = turns.length;
    const turn = { steps: [], stepsEl: null, stepEls: [] };
    turns.push(turn);
    const lines = new Map();
    let prose = null, text = "", raf = 0;
    const typing = art.querySelector(".typing");
    // Re-render the streamed text as formatted paragraphs and lists, once per frame.
    const paint = () => {
      raf = 0;
      if (!prose) return;
      let shown = text;
      if ((shown.match(/\*\*/g) || []).length % 2) shown = shown.replace(/\*\*(?![\s\S]*\*\*)/, ""); // bold still being written
      prose.replaceChildren(...Array.from(renderAnswer(shown).childNodes));
      let last = prose.lastElementChild;
      if (last && /^(UL|OL)$/.test(last.tagName)) last = last.lastElementChild;
      (last || prose).append(el("span", { className: "caret" }));
      stickToBottom();
    };
    const dropStatus = () => art.querySelector(".status")?.remove();
    return {
      turn: i,
      tool(e) {
        dropStatus();
        if (!turn.stepsEl) {
          turn.stepsEl = el("div", { className: "steps" });
          art.prepend(turn.stepsEl);
        }
        const line = stepEl(stepFromArgs(e.tool, e.args), e.args?.lang || lang, true);
        lines.set(e.id, line);
        turn.stepsEl.append(line);
        stickToBottom();
      },
      step(e) {
        const line = lines.get(e.id);
        if (!line) return;
        if (!e.step) { line.remove(); return; }
        line.classList.remove("running");
        if (e.step.error) line.classList.add("err");
        turn.steps.push(e.step);
        selectTurn(i, null, false);
      },
      delta(e) {
        dropStatus();
        typing?.remove();
        if (!prose) art.append((prose = el("div", { className: "prose live" })));
        text += e.text;
        raf ||= requestAnimationFrame(paint);
      },
      reset() {
        cancelAnimationFrame(raf);
        raf = 0;
        text = "";
        prose?.remove();
        prose = null;
        if (typing) art.append(typing);
      },
    };
  }

  async function readEvents(res, onEvent) {
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, nl).trim();
        buffer = buffer.slice(nl + 1);
        if (line) onEvent(JSON.parse(line));
      }
    }
  }

  async function send(text, ctx = {}) {
    text = text.trim();
    if (!text || busy) return;
    busy = true;
    if (!ctx.formEl) {
      input.value = "";
      autosize();
    }
    // A new turn starts: the previous turn's highlights end here.
    activeTurn = -1;
    activeStep = null;
    applyHighlight(false);
    await addUser(text);
    const art = addBotPending();
    scrollToBottom();
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          history,
          sessionId,
          hidden: [...[...baseState].filter(([, st]) => st === "hidden").map(([v]) => v), ...removedOwn].slice(-100),
          own: userRows.filter((r) => r.embeddedOnce).map(vid),
          bookings: heldBookings(),
          bookingForm: ctx.bookingForm,
          stream: true,
        }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `Request failed (${res.status})`);
      }
      const live = liveTurn(art, ctx.lang || kbLang);
      let result = null, failure = null;
      await readEvents(res, (e) => {
        if (e.type === "done") result = e;
        else if (e.type === "error") failure = e.error;
        else live[e.type]?.(e);
      });
      if (!result) throw new Error(failure || "Something went wrong. Please try again.");
      finishBot(art, result, { ...ctx, turn: live.turn });
      // Only the question and answer texts stay in the history; tool calls and results are not kept.
      history.push({ role: "user", content: text }, { role: "assistant", content: result.answer });
    } catch (err) {
      failBot(art, err.message || "Something went wrong. Please try again.");
      if (ctx.formEl) setFormState(ctx.formEl, "open");
      activeTurn = -1;
      activeStep = null;
      applyHighlight(false);
    } finally {
      busy = false;
      updateSend();
      stickToBottom();
      if (!ctx.formEl) input.focus();
    }
  }

  /* ── Composer & layout ─────────────────────────────────────────── */
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 240) + "px"; updateSend(); }
  function updateSend() { sendBtn.classList.toggle("ready", !!input.value.trim() && !busy); sendBtn.disabled = busy; }
  function scrollToBottom() { scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" }); }

  $("composer").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); } });
  document.querySelectorAll(".chips button").forEach((b) => b.addEventListener("click", () => send(b.textContent.trim())));
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
  $("jump").onclick = scrollToBottom;
  scroller.addEventListener("scroll", () => {
    $("jump").classList.toggle("show", scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight > 200);
  });
  /* ── Resizable panel ───────────────────────────────────────────── */
  const panel = $("panel"), handle = $("resize");
  const MIN_PANEL = 340, MIN_CHAT = 480, GUTTER = 20;
  const defaultWidth = () => Math.min(Math.round(window.innerWidth * 0.42), 620);
  const clampWidth = (w) => Math.max(MIN_PANEL, Math.min(w, window.innerWidth - MIN_CHAT - GUTTER));
  function setPanelWidth(w, save = false) {
    const width = clampWidth(w);
    panel.style.width = width + "px";
    handle.setAttribute("aria-valuenow", String(width));
    if (save) try { localStorage.setItem("kb-panel-width", String(width)); } catch {}
  }
  let stored = null;
  try { stored = Number(localStorage.getItem("kb-panel-width")) || null; } catch {}
  setPanelWidth(stored || defaultWidth());

  // Dragging well past the minimum width collapses the panel; the edge tab brings it back.
  const COLLAPSE_AT = MIN_PANEL - 110;
  function setCollapsed(collapsed) {
    frame.classList.toggle("panel-collapsed", collapsed);
    panel.classList.remove("will-collapse");
    try { localStorage.setItem("kb-panel-collapsed", collapsed ? "1" : ""); } catch {}
  }
  try { if (localStorage.getItem("kb-panel-collapsed") === "1") setCollapsed(true); } catch {}
  $("collapse-panel").onclick = () => setCollapsed(true);
  $("panel-tab").onclick = () => { setView("kb"); setCollapsed(false); };
  $("book-tab").onclick = () => { setView("book"); setCollapsed(false); };
  document.querySelectorAll(".views button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));

  handle.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    document.body.classList.add("resizing");
    const right = frame.getBoundingClientRect().right - 8;
    const startWidth = panel.getBoundingClientRect().width;
    let collapse = false;
    const move = (ev) => {
      const raw = right - ev.clientX - 6;
      collapse = raw < COLLAPSE_AT;
      panel.classList.toggle("will-collapse", collapse);
      setPanelWidth(raw);
    };
    const up = () => {
      document.body.classList.remove("resizing");
      handle.removeEventListener("pointermove", move);
      if (collapse) { setPanelWidth(startWidth, true); setCollapsed(true); }
      else setPanelWidth(panel.getBoundingClientRect().width, true);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up, { once: true });
    handle.addEventListener("pointercancel", up, { once: true });
  });
  handle.addEventListener("dblclick", () => setPanelWidth(defaultWidth(), true));
  handle.addEventListener("keydown", (e) => {
    const step = e.shiftKey ? 80 : 24;
    if (e.key === "ArrowLeft") setPanelWidth(panel.offsetWidth + step, true);
    if (e.key === "ArrowRight") setPanelWidth(panel.offsetWidth - step, true);
  });
  window.addEventListener("resize", () => setPanelWidth(panel.offsetWidth));

  $("open-panel").onclick = () => { setView("kb"); frame.classList.add("panel-open"); };
  $("open-book").onclick = () => { setView("book"); frame.classList.add("panel-open"); };
  $("close-panel").onclick = () => frame.classList.remove("panel-open");

  fetch("/knowledge")
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((d) => {
      entries = d.entries || [];
      catalog = { services: d.services || {}, dentists: d.dentists || [] };
      renderKnowledge();
      renderBookings();
      moveThumb(kbLang, false);
    })
    .catch(() => { kbEl.replaceChildren(el("div", { className: "panel-empty", textContent: "Could not load the dataset." })); });
</script>
</body>
</html>
